name: Validate QUIZ

on:
  push:
    branches:
      - mejora-lectura-confiable
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate QUIZ templates and logic
        run: node tests/validate-quiz.js
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local app server
        run: python3 -m http.server 4173 > /tmp/quiz-http.log 2>&1 &
      - name: Test interface and downloads in Chromium
        run: npm run test:browser
