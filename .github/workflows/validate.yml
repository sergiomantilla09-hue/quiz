name: Validate QUIZ

on:
  push:
    branches:
      - mejora-lectura-confiable
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate QUIZ templates and logic
        run: node tests/validate-quiz.js
